<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Miracle's Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="css/article.css">
</head>
<body>
    <div class="reading-progress" id="readingProgress">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <nav class="blog-nav">
        <div class="nav-container">
            <a href="../index.html" class="logo">Miracle</a>
            <ul class="nav-links">
                <li><a href="../index.html">首页</a></li>
                <li><a href="index.html">博客</a></li>
                <li><a href="../index.html#about">关于</a></li>
            </ul>
            <button class="mobile-menu-btn" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>

    <main class="article-main">
        <div class="container">
            <aside class="article-toc" id="articleToc">
                <div class="toc-header">
                    <h3><i class="fas fa-list"></i> 目录</h3>
                </div>
                <nav class="toc-content" id="tocContent">
                </nav>
            </aside>

            <article class="article-content">
                <header class="article-header">
                    <div class="article-meta" id="articleMeta">
                    </div>
                    <h1 class="article-title" id="articleTitle">加载中...</h1>
                    <div class="article-tags" id="articleTags">
                    </div>
                </header>

                <div class="article-body" id="articleBody">
                    <p>文章加载中...</p>
                </div>

                <footer class="article-footer">
                    <div class="article-nav" id="articleNav">
                    </div>
                    <a href="index.html" class="back-to-list">
                        <i class="fas fa-arrow-left"></i> 返回文章列表
                    </a>
                </footer>
            </article>
        </div>
    </main>

    <footer class="blog-footer">
        <p>&copy; 2024 Miracle. 用心创造，用爱设计 <i class="fas fa-heart"></i></p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="js/article.js"></script>
</body>
</html>
